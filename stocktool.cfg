; StockTool configuration.
; Symbols use Yahoo Finance notation: TSX = .TO, TSX Venture = .V,
; NYSE/Nasdaq = bare symbol (e.g. AAPL). Keep this file ASCII.

[settings]
; How often (seconds) prices are re-fetched. Clamped to 10..3600.
refresh_seconds=60
; Chart range selected at startup (overridden by the last-used range once saved): 1D 5D 1M 6M YTD 1Y 5Y MAX
default_range=1Y
; Trend inset in the chart corner: 5Y or 1Y
inset_range=5Y
; system | light | dark   (also in View > Theme)
theme=system
start_minimized=0
minimize_to_tray=0
; Portfolio totals are converted into this currency.
portfolio_currency=CAD
; Index drawn over the chart when View > Benchmark index is on (^GSPTSE = S&P/TSX Composite, ^GSPC = S&P 500).
benchmark=^GSPTSE
; Chart provider. {symbol} {range} {interval} are substituted at run time.
url_template=https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range={range}&interval={interval}&includePrePost=false&events=div
; Fundamentals (market cap, P/E, yield). Leave empty to disable.
quote_url_template=https://query2.finance.yahoo.com/v7/finance/quote?symbols={symbols}&crumb={crumb}
; Symbol search in the Add dialog. Leave empty to disable.
search_url_template=https://query2.finance.yahoo.com/v1/finance/search?q={query}&quotesCount=12&newsCount=0&listsCount=0
; Headlines pane: google (Google News, Canadian edition, searched by company name), yahoo, or none.
news_source=google
news_url_template=https://query2.finance.yahoo.com/v1/finance/search?q={symbol}&quotesCount=0&newsCount=8&listsCount=0
news_rss_template=https://news.google.com/rss/search?q={query}&hl=en-CA&gl=CA&ceid=CA:en

; Default watch list. Extra lists live in [stocks.<name>] sections (List menu).
[stocks]
RY.TO=Royal Bank of Canada
DOL.TO=Dollarama Inc.
BMO.TO=Bank of Montreal
BNS.TO=Bank of Nova Scotia
BN.TO=Brookfield Corporation

; symbol=shares,average cost   (written by Ticker > Holding...; shared by all lists)
[holdings]

; symbol=above,below   (written by Ticker > Alerts...; 0 = unset)
[alerts]

; symbol=CAD   (currency override when the provider labels a listing oddly)
[currency]

; SYMBOL.N=YYYY-MM-DD,shares,price   (written by Ticker > Transactions...; negative shares = sell; overrides [holdings])
[transactions]

; broker symbol=watch-list symbol, for File > Import from TD... when the automatic mapping
; (RY + market CA -> RY.TO) is not enough, e.g. fund codes:  TDB902=0P0000A30L
[symbol_map]

; Written by the app on exit: window placement and view toggles.
[state]
