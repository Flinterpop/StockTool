; StockTool configuration.
; Symbols use Yahoo Finance notation: TSX = .TO, TSX Venture = .V,
; NYSE/Nasdaq = bare symbol (e.g. AAPL). Keep this file ASCII.

[settings]
; How often (seconds) prices are re-fetched. Clamped to 10..3600.
refresh_seconds=60
; Chart range selected at startup: 1D 5D 1M 6M YTD 1Y 5Y MAX
default_range=1Y
; Quote provider. {symbol} {range} {interval} are substituted at run time.
url_template=https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range={range}&interval={interval}&includePrePost=false

[stocks]
; symbol=display name   (one per line, first entry is selected at startup)
RY.TO=Royal Bank of Canada
DOL.TO=Dollarama Inc.
BMO.TO=Bank of Montreal
BNS.TO=Bank of Nova Scotia
BN.TO=Brookfield Corporation
